{% widthratio course.pk 1 67 as hue_c %}{% if course.cover %}<img src="{{ course.cover.url }}" alt="" loading="lazy">{% else %}<svg class="cover-placeholder" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><radialGradient id="g{{ course.pk }}" cx="35%" cy="40%" r="75%"><stop offset="0" stop-color="hsl({{ hue_c }} 95% 70%)"/><stop offset=".45" stop-color="hsl({{ hue_c }} 80% 38%)"/><stop offset="1" stop-color="#050505"/></radialGradient></defs>
  <rect width="320" height="200" fill="url(#g{{ course.pk }})"/>
  <text x="22" y="180" font-family="Geologica, sans-serif" font-weight="200" font-size="34" fill="#fff" letter-spacing="-1.5">{{ course.title|truncatechars:18 }}</text>
</svg>{% endif %}
