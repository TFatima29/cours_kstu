{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="wrap page"><div class="narrow">
  <p class="crumbs"><a href="{% url 'accounts:profile' %}">Профиль</a></p>
  <h1>Смена пароля</h1>
  <form method="post" class="panel" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-primary btn-block" type="submit">Сменить пароль</button>
  </form>
</div></div>
{% endblock %}
