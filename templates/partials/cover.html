{% if course.cover %}<img src="{{ course.cover.url }}" alt="" loading="lazy">{% else %}<svg class="cover-placeholder" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="320" height="180" fill="var(--route-soft)"/>
  <path d="M-10 150 C 60 150, 70 90, 130 90 S 210 40, 330 40" stroke="var(--route)" stroke-width="6" fill="none" stroke-linecap="round" opacity=".85"/>
  <circle cx="40" cy="146" r="9" fill="var(--surface)" stroke="var(--route)" stroke-width="5"/>
  <circle cx="130" cy="90" r="9" fill="var(--surface)" stroke="var(--route)" stroke-width="5"/>
  <circle cx="230" cy="52" r="11" fill="var(--marker)"/>
  <text x="24" y="44" font-family="Unbounded, sans-serif" font-weight="600" font-size="22" fill="var(--route)">{{ course.title|slice:":1"|upper }}</text>
</svg>{% endif %}
