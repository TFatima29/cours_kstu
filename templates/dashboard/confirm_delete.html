{% extends "dashboard/base_dash.html" %}
{% block title %}Удаление{% endblock %}
{% block dash %}
<div class="panel" style="max-width:560px">
  <h1>Удалить {{ kind }} «{{ object }}»?</h1>
  <p>Вместе с ним удалится всё вложенное: уровни, уроки, материалы, вопросы и прогресс обучающихся. Отменить это нельзя.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Удалить</button>
    <a class="btn btn-secondary" href="{% url back back_pk %}">Отмена</a>
  </form>
</div>
{% endblock %}
